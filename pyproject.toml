[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphrag-discovery"
version = "0.1.0"
description = "Graph-RAG Discovery Engine over AI research papers (multi-hop reasoning, fully local)."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pandas",
    "numpy",
    "neo4j",
    "qdrant-client",
    "sentence-transformers",
    "langgraph",
    "ollama",
    "ragas",
    "langchain-ollama",  # M9.2: drive the Ragas judge with a local Ollama model
    "streamlit",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
